name: Check PR management configuration

on:
  pull_request:
    paths:
      - '.github/labels.yml'
      - '.github/pr-management.json'
      - '.github/pr-readiness-checks.yml'
      - '.github/workflows/pr-labelling.yaml'
      - '.github/workflows/pr-management.yaml'
      - '.github/workflows/check-pr-management.yaml'
      - '.github/workflows/sync-labels.yaml'
  push:
    branches: [main]
    paths:
      - '.github/labels.yml'
      - '.github/pr-management.json'
      - '.github/pr-readiness-checks.yml'
      - '.github/workflows/pr-labelling.yaml'
      - '.github/workflows/pr-management.yaml'
      - '.github/workflows/check-pr-management.yaml'
      - '.github/workflows/sync-labels.yaml'

permissions: {}

jobs:
  validate:
    permissions:
      contents: read
    uses: kyverno/assistant/.github/workflows/pr-management-validate.yml@b3dc405bb84f8903d28754c00254df6ce0fbbe8d
