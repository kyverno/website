name: PR Labeler

on:
  push:
    branches: [main]
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-labels-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  labeler:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Apply path labels and refresh merge-conflict labels
        uses: kyverno/kyverno/.github/actions/pr-management@0698cd2653c1242eca016b07b600c356da97af49
        with:
          mode: labels
          dry-run: 'false'
